<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f3ec" />
    <meta name="description" content="NÉRA — เชื่อมโยงผู้คน ภูมิปัญญา และโอกาส เพื่อชุมชนที่ยั่งยืน" />
    <title>NÉRA — A community, connected.</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      html,body{margin:0;min-height:100%;background:#f5f3ec;color:#173c32}
      .boot{min-height:100vh;display:grid;place-content:center;text-align:center;font:16px system-ui,sans-serif;padding:24px;box-sizing:border-box}
      .boot strong{font:700 32px Georgia,serif;letter-spacing:2px}
      .boot p{color:#777;margin-top:12px;max-width:36rem;line-height:1.7}
      .boot small{display:block;color:#a04b3f;margin-top:12px;font-size:12px;overflow-wrap:anywhere}
    </style>
    <script>
      (function () {
        function showBootError(message) {
          var root = document.getElementById('root');
          if (!root || !root.querySelector('.boot')) return;
          var detail = document.createElement('small');
          detail.textContent = message;
          var note = document.createElement('p');
          note.textContent = 'หน้าเว็บโหลดส่วนแสดงผลไม่สำเร็จ กรุณาส่งภาพหน้าจอนี้กลับมาเพื่อตรวจสอบ';
          root.querySelector('.boot').appendChild(note);
          root.querySelector('.boot').appendChild(detail);
        }
        window.addEventListener('error', function (event) {
          if (event.target && event.target.tagName === 'SCRIPT') {
            showBootError('ไม่สามารถโหลดไฟล์: ' + event.target.src);
          } else if (event.message) {
            showBootError('JavaScript: ' + event.message + (event.filename ? ' · ' + event.filename + ':' + event.lineno : ''));
          }
        }, true);
        window.addEventListener('unhandledrejection', function (event) {
          var reason = event.reason && (event.reason.message || String(event.reason));
          showBootError('Module error: ' + (reason || 'unknown'));
        });
        window.setTimeout(function () {
          showBootError('โหลดเกิน 10 วินาที · ตรวจสอบการเชื่อมต่อหรือไฟล์ JavaScript');
        }, 10000);
      })();
    </script>
  </head>
  <body>
    <div id="root"><div class="boot"><strong>NÉRA.</strong><p>กำลังเปิดพื้นที่ชุมชน…</p></div></div>
    <script type="module" src="./main.jsx"></script>
  </body>
</html>
